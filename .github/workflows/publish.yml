name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v0.2.2)
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Check package name and release tag
        run: |
          python - <<'PYCODE'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          expected_tag = f"v{project['version']}"
          if project['name'] != 'Wgram' or os.environ['RELEASE_TAG'] != expected_tag:
              raise SystemExit(
                  f"Expected Wgram {expected_tag}; got {project['name']} "
                  f"and tag {os.environ['RELEASE_TAG']}"
              )
          PYCODE
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build wheel and sdist
        run: python -m build --outdir "${{ runner.temp }}/dist"
      - name: Check distributions
        run: |
          python -m twine check --strict "${{ runner.temp }}/dist/"*
          python - <<'PYCODE'
          import email
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          dist = Path(os.environ['RUNNER_TEMP']) / 'dist'
          files = sorted(dist.iterdir())
          wheels = [p for p in files if p.suffix == '.whl']
          sdists = [p for p in files if p.name.endswith('.tar.gz')]
          if len(files) != 2 or len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f'Expected one wheel and one sdist: {files}')
          with zipfile.ZipFile(wheels[0]) as archive:
              metadata_file = next(n for n in archive.namelist() if n.endswith('.dist-info/METADATA'))
              wheel_metadata = email.message_from_bytes(archive.read(metadata_file))
          with tarfile.open(sdists[0], 'r:gz') as archive:
              metadata_file = next(m for m in archive.getmembers() if m.name.endswith('/PKG-INFO'))
              sdist_metadata = email.message_from_bytes(archive.extractfile(metadata_file).read())
          for metadata in (wheel_metadata, sdist_metadata):
              if metadata['Name'].lower() != 'wgram' or f"v{metadata['Version']}" != os.environ['RELEASE_TAG']:
                  raise SystemExit(f"Unexpected distribution metadata: {metadata['Name']} {metadata['Version']}")
          PYCODE
      - name: Upload checked distributions
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pypi-distributions
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download checked distributions
        uses: actions/download-artifact@v8.0.2
        with:
          name: pypi-distributions
          path: dist
      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@v1.14.3
